version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cogniflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db

  cogniflow:
    build: .
    container_name: cogniflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cogniflow
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:
